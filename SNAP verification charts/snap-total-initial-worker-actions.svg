rif" font-size="19" fill="#222222" text-anchor="start" font-weight="400">VC-1 among wrapped cases</text><text x="720" y="689" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222222" text-anchor="end" font-weight="400">2,325 / 8,590  (27.1%)</text></g></svg>