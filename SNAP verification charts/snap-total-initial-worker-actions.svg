<svg xmlns="http://www.w3.org/2000/svg" width="760" height="802" viewBox="0 0 760 802" role="img" aria-labelledby="title desc"><title id="title">Across all initial worker actions:  Interview and worker action (when interview is waived/ EDSAP)</title><desc id="desc">17,858 total cases. Wrapped (no VC-1 issued): 6,265, 35.1% of all cases; Wrapped (but VC-1 also issued): 2,325, 13.0% of all cases; Remaining not wrapped: 9,268, 51.9% of all cases. Wrapped cases: 8,590, 48.1%. VC-1 among wrapped cases: 27.1%.</desc><rect width="760" height="802" fill="#FFFFFF" /><text x="40" y="52" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#14558F" text-anchor="start" font-weight="500">Across all initial worker actions:</text><text x="40" y="83" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#14558F" text-anchor="start" font-weight="500">Interview and worker action</text><text x="40" y="114" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#14558F" text-anchor="start" font-weight="500">(when interview is waived/ EDSAP)</text><g transform="translate(0,62)"><text x="40" y="89" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#222222" text-anchor="start" font-weight="400">17,858 total cases</text><text x="40" y="121" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#535353" text-anchor="start" font-weight="400">Pie slices represent all cases in this group.</text><path d="M380,315 L380.0000,155.0000 A160,160 0 0,1 508.9546,409.7139 Z" fill="#0A2B48" stroke="#141414" stroke-width="1.5" stroke-linejoin="round" /><text x="476.35517851474305" y="273.21804049249357" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="500">35.1%</text><path d="M380,315 L508.9546,409.7139 A160,160 0 0,1 399.0387,473.8632 Z" fill="#7299BC" stroke="#141414" stroke-width="1.5" stroke-linejoin="round" /><text x="434.438177469103" y="415.27638947687916" font-family="Arial, Helvetica,