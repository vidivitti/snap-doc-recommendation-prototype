<svg xmlns="http://www.w3.org/2000/svg" width="760" height="780" viewBox="0 0 760 780" role="img" aria-labelledby="title desc"><title id="title">At worker action (EDSAP, waived interview)</title><desc id="desc">8,388 total cases. Not wrapped at worker action: 2,748, 32.8% of all cases; Wrapped (no VC-1 issued): 4,374, 52.1% of all cases; Wrapped (but VC-1 also issued): 1,266, 15.1% of all cases. Wrapped cases: 5,640, 67.2%. VC-1 among wrapped cases: 22.4%.</desc><rect width="760" height="780" fill="#FFFFFF" /><text x="40" y="52" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#14558F" text-anchor="start" font-weight="500">At worker action (EDSAP, waived interview)</text><text x="40" y="89" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#222222" text-anchor="start" font-weight="400">8,388 total cases</text><text x="40" y="121" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#535353" text-anchor="start" font-weight="400">Pie slices represent all cases in this group.</text><path d="M380,315 L380.0000,155.0000 A160,160 0 0,1 521.3503,389.9673 Z" fill="#535353" /><path d="M380,315 L521.3503,389.9673 A160,160 0 1,1 250.0100,221.7123 Z" fill="#14558F" /><path d="M380,315 L250.0100,221.7123 A160,160 0 0,1 380.0000,155.0000 Z" fill="#8AAAC7" /><rect x="40" y="510" width="16" height="16" fill="#535353" /><text x="70" y="526" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222222" text-anchor="start" font-weight="400">Not wrapped at worker action</text><text x="720" y="526" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222222" text-anchor="end" font-weight="400">2,748  (32.8%)</text><rect x="40" y="558" width="16" height="16" fill="#14558F" /><text x="70" y="574" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222222" text-anchor="start" font-weight="400">Wrapped (no VC-1 issued)</text><text x="720" y="574" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222222" text-anchor="end" font-weight="400">4,374  (52.1%)</text><rect x="40" y="606" width="16" height="16" fill="#8AAAC7" /><text x="70" y="622" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222222" text-anchor="start" font-weight="400">Wrapped (but VC-1 also issued)</text><text x="720" y="622" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222222" text-anchor="end" font-weight="400">1,266  (15.1%)</text><line x1="40" x2="720" y1="652" y2="652" stroke="#D6D6D6" /><text x="40" y="690" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222222" text-anchor="start" font-weight="400">Wrapped at worker action</text><text x="720" y="690" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222222" text-anchor="end" font-weight="400">5,640 / 8,388  (67.2%)</text><text x="40" y="729" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222222" text-anchor="start" font-weight="400">VC-1 among wrapped cases</text><text x="720" y="729" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222222" text-anchor="end" font-weight="400">1,266 / 5,640  (22.4%)</text></svg>