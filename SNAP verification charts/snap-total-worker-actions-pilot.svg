<svg xmlns="http://www.w3.org/2000/svg" width="760" height="830" viewBox="0 0 760 830" role="img" aria-labelledby="title desc"><title id="title">Across all worker actions (interview and when interview is waived/EDSAP) - Potential pilot scenario</title><desc id="desc">17,858 total cases. Wrapped (no VC-1 issued): 6,265, 35.1% of all cases; Wrapped (but VC-1 also issued): 2,325, 13.0% of all cases; Additional wrapped cases with pilot (TBD): 1,786, 10.0% of all cases; Remaining not wrapped: 7,482, 41.9% of all cases. Wrapped cases: 10,376, 58.1%. Pilot scenario adds 10 percentage points. VC-1 status of the additional cases is unspecified.</desc><rect width="760" height="830" fill="#FFFFFF" /><text x="40" y="52" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#14558F" text-anchor="start" font-weight="500">Across all worker actions</text><text x="40" y="83" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#14558F" text-anchor="start" font-weight="500">(interview and when interview is waived/EDSAP)</text><text x="40" y="114" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#14558F" text-anchor="start" font-weight="500">- Potential pilot scenario</text><g transform="translate(0,62)"><text x="40" y="89" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#222222" text-anchor="start" font-weight="400">17,858 total cases</text><text x="40" y="121" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#535353" text-anchor="start" font-weight="400">10% of all cases additionally wrapped (rounded to whole cases)</text><path d="M380,315 L380.0000,155.0000 A160,160 0 0,1 508.9546,409.7139 Z" fill="#0A2B48" stroke="#141414" stroke-width="1.5" stroke-linejoin="round" /><text x="476.35517851474305" y="273.21804049249357" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="500">35.1%</text><path d="M380,315 L508.9546,409.7139 A160,160 0 0,1 399.0387,473.8632 Z" fill="#7299BC" stroke="#141414" stroke-width="1.5" stroke-linejoin="round" /><text x="434.438177469103" y="415.27638947687916" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#141414" text-anchor="middle" font-weight="500">13.0%</text><path d="M380,315 L399.0387,473.8632 A160,160 0 0,1 302.0153,454.7082 Z" fill="#2D6A46" stroke="#141414" stroke-width="1.5" stroke-linejoin="round" /><text x="359.081670962316" y="427.9548182494368" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="500">10.0%</text><path d="M380,315 L302.0153,454.7082 A160,160 0 0,1 380.0000,155.0000 Z" fill="#E6E6E6" stroke="#141414" stroke-width="1.5" stroke-linejoin="round" /><text x="275.4803145168602" y="294.8037622729626" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#141414" text-anchor="middle" font-weight="500">41.9%</text><rect x="40" y="510" width="16" height="16" fill="#0A2B48" /><text x="70" y="526" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222222" text-anchor="start" font-weight="400">Wrapped (no VC-1 issued)</text><text x="720" y="526" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222222" text-anchor="end" font-weight="400">6,265  (35.1%)</text><rect x="40" y="538" width="16" height="16" fill="#7299BC" /><text x="70" y="554" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222222" text-anchor="start" font-weight="400">Wrapped (but VC-1 also issued)</text><text x="720" y="554" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222222" text-anchor="end" font-weight="400">2,325  (13.0%)</text><rect x="40" y="566" width="16" height="16" fill="#2D6A46" /><text x="70" y="582" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222222" text-anchor="start" font-weight="400">Additional wrapped cases with pilot (TBD)</text><text x="720" y="582" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222222" text-anchor="end" font-weight="400">1,786  (10.0%)</text><rect x="40" y="594" width="16" height="16" fill="#E6E6E6" /><text x="70" y="610" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222222" text-anchor="start" font-weight="400">Remaining not wrapped</text><text x="720" y="610" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222222" text-anchor="end" font-weight="400">7,482  (41.9%)</text><line x1="40" x2="720" y1="640" y2="640" stroke="#D6D6D6" /><text x="40" y="678" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222222" text-anchor="start" font-weight="400">Projected total wrapped</text><text x="720" y="678" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222222" text-anchor="end" font-weight="400">10,376 / 17,858  (58.1%)</text><text x="40" y="717" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222222" text-anchor="start" font-weight="400">Increase in wrap rate</text><text x="720" y="717" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222222" text-anchor="end" font-weight="400">+10 percentage points</text></g></svg>