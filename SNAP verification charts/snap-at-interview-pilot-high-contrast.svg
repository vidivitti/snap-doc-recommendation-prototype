<svg xmlns="http://www.w3.org/2000/svg" width="760" height="768" viewBox="0 0 760 768" role="img" aria-labelledby="title desc"><title id="title">At interview - Pilot scenario</title><desc id="desc">9,470 total cases. Wrapped (no VC-1 issued): 1,891, 20.0% of all cases; Wrapped (but VC-1 also issued): 1,059, 11.2% of all cases; Additional wrapped cases with pilot (TBD): 947, 10.0% of all cases; Remaining not wrapped: 5,573, 58.8% of all cases. Wrapped cases: 3,897, 41.2%. Pilot scenario adds 10 percentage points. VC-1 status of the additional cases is unspecified.</desc><rect width="760" height="768" fill="#FFFFFF" /><text x="40" y="52" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#14558F" text-anchor="start" font-weight="500">At interview - Pilot scenario</text><g transform="translate(0,0)"><text x="40" y="89" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#222222" text-anchor="start" font-weight="400">9,470 total cases</text><text x="40" y="121" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#535353" text-anchor="start" font-weight="400">10% of all cases additionally wrapped with intervention</text><path d="M380,315 L380.0000,155.0000 A160,160 0 0,1 532.0703,265.2545 Z" fill="#0A2B48" stroke="#141414" stroke-width="1.5" stroke-linejoin="round" /><text x="443.3938192243625" y="234.56303022091373" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="500">20.0%</text><path d="M380,315 L532.0703,265.2545 A160,160 0 0,1 528.1987,375.3087 Z" fill="#7299BC" stroke="#141414" stroke-width="1.5" stroke-linejoin="round" /><text x="487.9332332056587" y="325.7969948344568" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#141414" text-anchor="middle" font-weight="500">11.2%</text><path d="M380,315 L528.1987,375.3087 A160,160 0 0,1 464.4467,450.8998 Z" fill="#2D6A46" stroke="#141414" stroke-width="1.5" stroke-linejoin="round" /><text x="462.5585368289247" y="391.62821264880415" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" text-anchor="middle" font-weight="500">10.0%</text><path d="M380,315 L464.4467,450.8998 A160,160 0 1,1 380.0000,155.0000 Z" fill="#E6E6E6" stroke="#141414" stroke-width="1.5" stroke-linejoin="round" /><text x="276.1465107061931" y="351.63870377565684" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#141414" text-anchor="middle" font-weight="500">58.8%</text><rect x="40" y="510" width="16" height="16" fill="#0A2B48" /><text x="70" y="526" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222222" text-anchor="start" font-weight="400">Wrapped (no VC-1 issued)</text><text x="720" y="526" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222222" text-anchor="end" font-weight="400">1,891  (20.0%)</text><rect x="40" y="538" width="16" height="16" fill="#7299BC" /><text x="70" y="554" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222222" text-anchor="start" font-weight="400">Wrapped (but VC-1 also issued)</text><text x="720" y="554" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222222" text-anchor="end" font-weight="400">1,059  (11.2%)</text><rect x="40" y="566" width="16" height="16" fill="#2D6A46" /><text x="70" y="582" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222222" text-anchor="start" font-weight="400">Additional wrapped cases with pilot (TBD)</text><text x="720" y="582" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222222" text-anchor="end" font-weight="400">947  (10.0%)</text><rect x="40" y="594" width="16" height="16" fill="#E6E6E6" /><text x="70" y="610" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222222" text-anchor="start" font-weight="400">Remaining not wrapped</text><text x="720" y="610" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#222222" text-anchor="end" font-weight="400">5,573  (58.8%)</text><line x1=